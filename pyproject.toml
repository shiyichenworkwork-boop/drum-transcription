[project]
name = "local-drum-separator"
version = "0.2.0"
description = "本地运行的鼓轨、人声分离与鼓点 MIDI 工具"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "adtof-pytorch @ https://github.com/xavriley/ADTOF-pytorch/archive/85c192e78f716ea0b111cc8a5ee4a8f6a3a4f8a9.zip",
  "beat-this==1.1.0",
  "demucs==4.0.1",
  "fastapi>=0.115,<1",
  "filetype>=1.2,<2",
  "imageio-ffmpeg>=0.6,<1",
  "librosa>=0.10,<1",
  "llvmlite==0.44.0; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "llvmlite>=0.44,<1; sys_platform != 'darwin' or platform_machine != 'x86_64'",
  "melband-roformer-infer==0.1.5",
  "mido>=1.3,<2",
  "numpy>=1.24,<2",
  "numba==0.61.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "numba>=0.61,<1; sys_platform != 'darwin' or platform_machine != 'x86_64'",
  "omegaconf>=2.3,<3",
  "python-multipart>=0.0.20,<1",
  "pywebview==6.2.1",
  "scipy>=1.10,<2",
  "soundfile>=0.12,<1",
  "torch==2.2.2; sys_platform == 'darwin'",
  "torchaudio==2.2.2; sys_platform == 'darwin'",
  "tqdm>=4.65,<5",
  "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
]
packaging = [
  "pillow>=10,<13",
  "pyinstaller>=6.18,<7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
package = false
