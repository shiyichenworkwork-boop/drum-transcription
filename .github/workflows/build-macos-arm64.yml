name: Build macOS Apple Silicon

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/build-macos-arm64.yml"
      - "app/**"
      - "packaging/**"
      - "scripts/**"
      - "pyproject.toml"
      - "uv.lock"
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-arm64:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      MACOS_TARGET_ARCH: arm64
      MACOS_CODESIGN_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install "uv==0.12.3"

      - name: Import Developer ID certificate
        if: ${{ env.APPLE_CERTIFICATE_BASE64 != '' }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p actions "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p actions "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k actions "$KEYCHAIN_PATH"

      - name: Build app and DMG
        env:
          UV_BIN: uv
        run: ./scripts/build_macos.sh

      - name: Notarize DMG
        if: ${{ env.MACOS_CODESIGN_IDENTITY != '' && env.APPLE_ID != '' && env.APPLE_TEAM_ID != '' && env.APPLE_APP_PASSWORD != '' }}
        run: |
          DMG="dist/AI-Audio-Separator-macOS-arm64.dmg"
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait
          xcrun stapler staple "$DMG"
          (
            cd dist
            shasum -a 256 AI-Audio-Separator-macOS-arm64.dmg > AI-Audio-Separator-macOS-arm64.dmg.sha256
          )

      - uses: actions/upload-artifact@v4
        with:
          name: AI-Audio-Separator-macOS-arm64
          path: |
            dist/AI-Audio-Separator-macOS-arm64.dmg
            dist/AI-Audio-Separator-macOS-arm64.dmg.sha256
          if-no-files-found: error
          compression-level: 0
